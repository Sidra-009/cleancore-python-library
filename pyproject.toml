[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cleancore"
version = "1.1.0"
description = "Zero-dependency data observability with row-level audit trails and schema drift detection"
readme = "README.md"
authors = [{name = "Sidra Saqlain", email = "sidrasaqlain11@gmail.com"}]
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = ["audit", "data-pipeline", "observability", "schema-drift", "logging", "provenance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Logging",
]

[project.urls]
Homepage = "https://github.com/Sidra-009/cleancore-python-library"
Repository = "https://github.com/Sidra-009/cleancore-python-library"
"Bug Tracker" = "https://github.com/Sidra-009/cleancore-python-library/issues"

[project.scripts]
cleancore = "cleancore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cleancore*"]
